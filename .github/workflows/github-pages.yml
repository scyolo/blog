name: Verify and deploy GitHub Pages

on:
  push:
    branches: [codex/github-pages]
  pull_request:
    branches: [codex/github-pages]

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  # Separate from the SITE_URL repository variable used by main's other host.
  SITE_URL: ${{ vars.GITHUB_PAGES_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: verify-pages-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm validate:content
      - run: pnpm test:foundation
      - run: pnpm test:coverage
      - run: pnpm audit:security
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise root-hosted content lifecycle in isolation
        run: pnpm test:build-contract
        env:
          SITE_URL: https://example.invalid/
      - name: Build final Pages artifact once
        run: pnpm build
      - run: pnpm verify:artifact
      - run: pnpm artifact:seal
      - run: pnpm test:e2e
      - run: pnpm test:performance
      - run: pnpm artifact:check
      - name: Upload the verified Pages artifact
        if: ${{ github.ref == 'refs/heads/codex/github-pages' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 7
      - name: Keep diagnostics only on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/
            .cache/performance/
            coverage/coverage-summary.json
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    if: ${{ github.ref == 'refs/heads/codex/github-pages' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reject stale branch revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/github-pages" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped stale Pages artifact: $GITHUB_SHA is not the branch head." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read the enabled Pages configuration
        if: ${{ steps.revision.outputs.current == 'true' }}
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Ensure the artifact targets this Pages site
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { normalizeSiteUrl } from "./src/lib/site-url.ts";
          assert.equal(normalizeSiteUrl(process.env.PAGES_URL, true), normalizeSiteUrl(process.env.SITE_URL, true), "Set GITHUB_PAGES_SITE_URL to the actual Pages URL and rebuild before deploying.");
          NODE
      - name: Deploy without rebuilding
        if: ${{ steps.revision.outputs.current == 'true' }}
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the live revision, pages, search and 404
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from "node:timers/promises";
          import { normalizeSiteUrl } from "./src/lib/site-url.ts";
          import { smokeDeployment } from "./scripts/lib/deployment.mjs";
          const site = normalizeSiteUrl(process.env.PAGES_URL, true);
          for (let attempt = 1; attempt <= 8; attempt++) {
            try {
              await smokeDeployment(site, process.env.GITHUB_SHA);
              console.log("Verified GitHub Pages:", site, process.env.GITHUB_SHA);
              break;
            } catch (error) {
              if (attempt === 8) throw error;
              console.warn("Waiting for the deployed revision:", error.message);
              await delay(10000);
            }
          }
          NODE

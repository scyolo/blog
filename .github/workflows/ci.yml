name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      failure_drill:
        description: "Deliberately fail a test gate; production must not deploy"
        type: boolean
        default: false
permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deliberate test failure drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_drill }}
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.fail('Intentional gate failure. Deployment must stay skipped.');"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm validate:content
      - run: pnpm test:foundation
      - run: pnpm test:coverage
      - run: pnpm audit:security
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:build-contract
      - name: Build final deployment artifact once
        run: pnpm build
      - run: pnpm verify:artifact
      - run: pnpm artifact:seal
      - run: pnpm test:e2e
      - run: pnpm test:performance
      - run: pnpm artifact:check
      - name: Keep the exact verified release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: |
            dist/
            .cache/artifact-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Keep diagnostics only on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/
            .cache/performance/
            coverage/coverage-summary.json
          include-hidden-files: true
          retention-days: 7
      - name: State deployment configuration explicitly
        if: ${{ vars.SITE_URL == '' || vars.CLOUDFLARE_PROJECT_NAME == '' }}
        run: echo "Engineering verification only. Cloudflare deployment is NOT configured. Set SITE_URL / CLOUDFLARE_PROJECT_NAME variables and CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SITE_URL != '' && vars.CLOUDFLARE_PROJECT_NAME != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ github.sha }}
          path: .
          digest-mismatch: error
      - name: Verify bytes, reject stale main, upload once and smoke-test
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          GH_TOKEN: ${{ github.token }}
